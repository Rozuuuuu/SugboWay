name: security-scan

# Dependency vulnerability scanning for all three services. Runs on pushes and
# PRs that touch a service's dependency manifest, plus a weekly sweep so newly
# disclosed CVEs in already-pinned deps are caught even without a code change.
#
# This does NOT gate Render deploys (Render builds from the subdirectories
# directly). It's an early-warning signal; a red run means a dependency needs
# bumping. See docs/security-checklist.md.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-govulncheck:
    name: Go (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sugboway-routing-api/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        working-directory: sugboway-routing-api
        run: govulncheck ./...

  python-pip-audit:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Scan
        working-directory: sugboway-ai-service
        run: pip-audit -r requirements.txt --strict

  web-npm-audit:
    name: Web (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit production dependencies
        working-directory: sugboway-web
        run: npm audit --omit=dev --audit-level=high
